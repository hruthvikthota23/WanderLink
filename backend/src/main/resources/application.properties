# WanderLink Spring Boot Configuration
server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=wanderlink-backend

# MySQL 8 Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wanderlink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
# 256-bit base64/hex secret for HMAC-SHA256 signing
wanderlink.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
wanderlink.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Demo Data Seeder Configuration (true = populate coherent Goa scenario on startup)
wanderlink.data.seed=${WANDERLINK_SEED_DATA:true}

# Comma-separated browser origins allowed to call this API
wanderlink.cors.allowed-origins=${WANDERLINK_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# AI Assistant Configuration
wanderlink.ai.api-key=${WANDERLINK_AI_API_KEY:}
wanderlink.ai.model=${WANDERLINK_AI_MODEL:gpt-6-luna}
wanderlink.ai.api-url=${WANDERLINK_AI_API_URL:https://api.openai.com/v1/responses}
